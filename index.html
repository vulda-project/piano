<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1a19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>스테이지 피아노</title>
<style>
  :root{
    --room:#0b1413;
    --chassis:#1d4442;
    --chassis-hi:#2d625d;
    --chassis-lo:#102b29;
    --chrome:#d3dcda;
    --chrome-dim:#7e908d;
    --rocker:#c8452a;
    --rocker-hot:#ff7145;
    --key:#f4efe2;
    --key-lo:#ddd5c1;
    --ebony:#16130f;
    --ink:#d5e5e2;
    --ink-dim:#89a5a1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;overscroll-behavior:none;}
  body{
    background:radial-gradient(130% 90% at 50% -10%,#16302e 0%,var(--room) 60%,#060d0c 100%);
    color:var(--ink);
    font-family:"Arial Narrow","Helvetica Neue",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== 본체 ===== */
  .machine{
    width:100%;max-width:1180px;
    height:min(calc(100dvh - 40px),660px);
    display:flex;flex-direction:column;
    background:
      linear-gradient(180deg,var(--chassis-hi) 0%,var(--chassis) 12%,var(--chassis-lo) 100%);
    border-radius:14px;
    box-shadow:
      0 1px 0 rgba(220,255,250,.22) inset,
      0 0 0 1px #071615,
      0 34px 70px -26px rgba(0,0,0,.95);
    overflow:hidden;
    position:relative;
  }
  /* 톨렉스 결 */
  .machine::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(45deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);
    opacity:.6;
  }

  /* ===== 컨트롤 패널 ===== */
  .panel{
    position:relative;z-index:2;
    display:flex;align-items:center;gap:14px 20px;
    padding:12px 18px;
    border-bottom:1px solid rgba(0,0,0,.5);
    box-shadow:0 1px 0 rgba(200,255,248,.12);
    flex-wrap:wrap;
  }

  .brand{display:flex;flex-direction:column;gap:3px;padding-right:6px;}
  .brand .name{
    font-size:19px;font-weight:700;letter-spacing:.16em;line-height:1;
    background:linear-gradient(180deg,#ffffff 0%,var(--chrome) 45%,var(--chrome-dim) 55%,#eef5f3 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.55));
  }
  .brand .sub{font-size:11px;color:var(--ink-dim);letter-spacing:.02em;}

  .rack{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto;}
  .mod{
    display:flex;flex-direction:column;gap:5px;
    padding:7px 10px;border-radius:7px;
    background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.13));
    box-shadow:0 1px 0 rgba(200,255,248,.10),0 2px 5px rgba(0,0,0,.35) inset;
  }
  .mod[hidden]{display:none!important;}
  .mod > span{font-size:10.5px;color:var(--ink-dim);letter-spacing:.03em;}
  .mod .row{display:flex;align-items:center;gap:6px;}

  select,button{
    font:inherit;font-size:13px;color:var(--ink);
    background:linear-gradient(180deg,#0e2523,#081817);
    border:1px solid rgba(190,230,225,.22);
    border-radius:5px;padding:5px 9px;
    cursor:pointer;touch-action:manipulation;
  }
  select{max-width:120px;}
  .range-nav{min-width:27px;padding:5px 7px;}
  .range-readout{min-width:46px;text-align:center;color:var(--ink);font-size:11px;white-space:nowrap;}
  button:hover,select:hover{border-color:rgba(210,245,240,.5);}
  button:active{transform:translateY(1px);}
  :focus-visible{outline:2px solid var(--rocker-hot);outline-offset:2px;}

  /* 로커 스위치 */
  .rocker{
    min-width:60px;text-align:center;font-weight:700;letter-spacing:.04em;
    border-radius:5px;
    box-shadow:0 2px 0 rgba(0,0,0,.5),0 -1px 0 rgba(255,255,255,.07) inset;
  }
  .rocker[aria-pressed="true"]{
    background:linear-gradient(180deg,var(--rocker-hot),var(--rocker));
    border-color:#ffb59b;color:#fff4ee;
    box-shadow:0 0 14px rgba(255,113,69,.55),0 1px 0 rgba(0,0,0,.4);
  }
  .step{min-width:30px;padding:5px 0;font-size:15px;line-height:1;}
  .readout{
    min-width:40px;text-align:center;font-size:13px;font-weight:700;
    color:#ffd9c9;letter-spacing:.04em;
    background:#0a1c1b;border-radius:4px;padding:5px 4px;
    box-shadow:0 0 8px rgba(255,120,70,.18) inset,0 1px 2px rgba(0,0,0,.6) inset;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:96px;height:20px;background:none;
    accent-color:var(--rocker-hot);touch-action:manipulation;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;background:#08201e;box-shadow:0 1px 2px rgba(0,0,0,.7) inset;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:20px;margin-top:-8px;border-radius:3px;
    background:linear-gradient(180deg,#e9f2f0,#93a5a2);border:1px solid #05100f;
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#08201e;}
  input[type=range]::-moz-range-thumb{width:14px;height:20px;border-radius:3px;background:#e0eae8;border:1px solid #05100f;}

  /* ===== 건반 ===== */
  .keybed{
    position:relative;z-index:2;flex:1;min-height:0;
    display:flex;flex-direction:column;
    background:#070d0c;
    box-shadow:0 14px 24px -10px rgba(0,0,0,.9) inset;
  }
  .strip{
    height:7px;flex:none;
    background:linear-gradient(180deg,#f0f5f3,var(--chrome) 35%,#5d6d6b 70%,#26302f);
  }
  .piano{
    position:relative;flex:1;min-height:0;display:flex;
    padding:7px 7px 0;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }

  .key{position:relative;cursor:pointer;}
  .lbl{
    position:absolute;left:0;right:0;bottom:10px;text-align:center;
    font-size:11px;letter-spacing:.02em;pointer-events:none;
  }

  .white{
    flex:1 1 0;min-width:0;
    background:linear-gradient(180deg,#fffdf6 0%,var(--key) 60%,var(--key-lo) 100%);
    border-radius:0 0 5px 5px;
    margin-right:2px;
    box-shadow:
      0 -1px 0 rgba(0,0,0,.3) inset,
      -1px 0 2px rgba(0,0,0,.3),
      0 6px 5px -3px rgba(0,0,0,.6);
  }
  .white:last-child{margin-right:0;}
  .white .lbl{color:#93876b;}
  .white.on{
    background:linear-gradient(180deg,#ffe3cf 0%,#f0d3ba 55%,#dbb99c 100%);
    box-shadow:0 -1px 0 rgba(0,0,0,.35) inset,0 2px 3px -1px rgba(0,0,0,.6);
  }

  .black{
    position:absolute;top:7px;height:60%;z-index:3;
    background:linear-gradient(180deg,#4a423a 0%,var(--ebony) 30%,#080706 100%);
    border-radius:0 0 4px 4px;
    box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 7px 7px -3px rgba(0,0,0,.85);
  }
  .black .lbl{color:#a2937a;bottom:8px;font-size:10px;}
  .black.on{
    background:linear-gradient(180deg,#8a4a2c 0%,#3a1d10 100%);
    height:58.5%;
    box-shadow:0 0 10px rgba(255,120,70,.35),0 2px 3px rgba(0,0,0,.8);
  }

  .hint{
    flex:none;padding:7px 16px 9px;font-size:11.5px;color:var(--ink-dim);
    display:flex;flex-wrap:wrap;gap:3px 22px;line-height:1.7;
    background:linear-gradient(180deg,#0a1c1a,#071211);
    border-top:1px solid rgba(0,0,0,.6);
  }
  .hint b{color:var(--ink);font-weight:700;}
  kbd{
    display:inline-block;min-width:18px;text-align:center;padding:0 5px;margin:0 1px;
    border-radius:3px;background:#0d2523;border:1px solid rgba(190,230,225,.28);
    border-bottom-width:2px;color:#cfe3e0;font-family:inherit;font-size:10.5px;
  }

  /* ===== 낮은 화면(모바일 가로): 컨트롤을 왼쪽 레일로 ===== */
  @media (max-height:560px){
    body{padding:0;}
    .machine{height:100dvh;max-width:none;border-radius:0;flex-direction:row;}
    .panel{
      flex-direction:column;align-items:stretch;flex-wrap:nowrap;
      width:126px;flex:none;gap:8px;padding:10px 9px;
      padding-left:max(9px,env(safe-area-inset-left));
      border-bottom:none;border-right:1px solid rgba(0,0,0,.5);
      box-shadow:1px 0 0 rgba(200,255,248,.12);
      overflow-y:auto;
    }
    .brand{padding:0 0 2px;}
    .brand .name{font-size:15px;letter-spacing:.12em;}
    .brand .sub{display:none;}
    .rack{flex-direction:column;align-items:stretch;gap:8px;margin-left:0;}
    .mod{padding:6px 8px;}
    .mod > span{font-size:10px;}
    select{max-width:none;width:100%;font-size:12px;padding:4px 6px;}
    .rocker{flex:1;min-width:0;font-size:12px;padding:6px 4px;}
    input[type=range]{width:100%;}
    .keybed{padding-right:env(safe-area-inset-right);}
    .piano{padding:6px 6px 0;}
    .lbl{bottom:7px;font-size:10px;}
    .black .lbl{font-size:9px;bottom:6px;}
    .hint{display:none;}
  }

  /* ===== 세로 모드 안내 ===== */
  .rotate{display:none;}
  @media (orientation:portrait) and (pointer:coarse){
    .machine{display:none;}
    .rotate{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:22px;text-align:center;padding:32px;
      position:fixed;inset:0;
    }
  }
  .rotate .glyph{
    width:74px;height:118px;border-radius:12px;
    border:3px solid var(--chrome-dim);
    box-shadow:0 0 0 1px rgba(0,0,0,.5);
    position:relative;
    animation:tip 2.8s ease-in-out infinite;
  }
  .rotate .glyph::after{
    content:"";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
    width:26px;height:3px;border-radius:2px;background:var(--chrome-dim);
  }
  @keyframes tip{
    0%,32%{transform:rotate(0deg);}
    58%,88%{transform:rotate(-90deg);}
    100%{transform:rotate(0deg);}
  }
  .rotate h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--ink);}
  .rotate p{margin:0;max-width:24em;font-size:13.5px;line-height:1.7;color:var(--ink-dim);}
  .rotate button{font-size:15px;padding:11px 20px;border-radius:7px;}
  @media (prefers-reduced-motion:reduce){
    .rotate .glyph{animation:none;transform:rotate(-90deg);}
  }
</style>
</head>
<body>

<div class="rotate">
  <div class="glyph"></div>
  <h2>기기를 가로로 돌려주세요</h2>
  <p id="rotateText">건반이 넓게 펼쳐져야 연주할 수 있습니다.</p>
  <button id="lockBtnRot">가로 전체화면으로 열기</button>
</div>

<div class="machine">
  <div class="panel">
    <div class="brand">
      <div class="name">피아노</div>
      <div class="sub">오프라인 스테이지 건반</div>
    </div>

    <div class="rack">
      <div class="mod">
        <span>음색</span>
        <div class="row">
          <select id="timbre" aria-label="음색">
            <option value="grand">그랜드</option>
            <option value="rhodes">전자 피아노</option>
            <option value="organ">오르간</option>
          </select>
        </div>
      </div>

      <div class="mod">
        <span>건반 이름</span>
        <div class="row">
          <select id="labelMode" aria-label="건반 이름 표시">
            <option value="key">컴퓨터 자판</option>
            <option value="solfa">도레미</option>
            <option value="abc">CDE</option>
            <option value="none">없음</option>
          </select>
        </div>
      </div>

      <div class="mod">
        <span>옥타브</span>
        <div class="row">
          <button class="step" id="octDown" aria-label="옥타브 내리기">−</button>
          <span class="readout" id="octLabel">C4</span>
          <button class="step" id="octUp" aria-label="옥타브 올리기">+</button>
        </div>
      </div>

      <div class="mod" id="rangeMod" hidden>
        <span>표시 옥타브 · 건반을 좌우로 밀어 이동</span>
        <div class="row">
          <button class="range-nav" id="rangePrev" aria-label="낮은 옥타브로 이동">‹</button>
          <select id="rangeSelect" aria-label="화면에 표시할 옥타브 수">
            <option value="1">1옥타브</option>
            <option value="2" selected>2옥타브</option>
            <option value="3">3옥타브</option>
            <option value="4">4옥타브</option>
          </select>
          <span class="range-readout" id="rangeLabel" aria-live="polite"></span>
          <button class="range-nav" id="rangeNext" aria-label="높은 옥타브로 이동">›</button>
        </div>
      </div>

      <div class="mod">
        <span>스위치</span>
        <div class="row">
          <button class="rocker" id="sustainBtn" aria-pressed="false">페달</button>
          <button class="rocker" id="lockBtn" aria-pressed="false">고정</button>
        </div>
      </div>

      <div class="mod">
        <span>음량</span>
        <div class="row"><input type="range" id="vol" min="0" max="100" value="75" aria-label="음량"></div>
      </div>

      <div class="mod" id="fsMod" hidden>
        <span>화면</span>
        <div class="row"><button class="rocker" id="fsBtn" aria-pressed="false">전체화면</button></div>
      </div>
    </div>
  </div>

  <div class="keybed">
    <div class="strip"></div>
    <div class="piano" id="piano"></div>
    <div class="hint">
      <div><b>흰건반</b> <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd><kbd>V</kbd><kbd>B</kbd><kbd>N</kbd><kbd>M</kbd> · 윗줄 <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd></div>
      <div><b>검은건반</b> <kbd>S</kbd><kbd>D</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd> · <kbd>2</kbd><kbd>3</kbd><kbd>5</kbd><kbd>6</kbd><kbd>7</kbd></div>
      <div><b>페달</b> <kbd>Space</kbd></div>
      <div><b>고정</b> 마우스로 화음을 쌓을 때</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var NOTE_ABC = ['C','C\u266F','D','D\u266F','E','F','F\u266F','G','G\u266F','A','A\u266F','B'];
  var NOTE_SOLFA = ['\uB3C4','\uB3C4\u266F','\uB808','\uB808\u266F','\uBBF8','\uD30C','\uD30C\u266F','\uC194','\uC194\u266F','\uB77C','\uB77C\u266F','\uC2DC'];
  var BLACK_SET = {1:1,3:1,6:1,8:1,10:1};
  function isBlack(m){ return !!BLACK_SET[m % 12]; }

  var GLOBAL_START = 36, GLOBAL_END = 84;
  var START = 48, END = 84;

  /* ---------- 오디오 ---------- */
  var ctx = null, master = null, noiseBuf = null;
  var active = new Map();
  var held = new Set();
  var pedaled = new Set();
  var locked = new Set();
  var sustain = false, lockMode = false;
  var volume = 0.75;

  var TIMBRES = {
    grand:  { partials:[1,0.44,0.21,0.12,0.065,0.038,0.02], decay:7.5, hold:false, hammer:0.5,  gain:0.30 },
    rhodes: { partials:[1,0.03,0.28,0.02,0.10,0.01,0.05],   decay:5.5, hold:false, hammer:0.22, gain:0.32 },
    organ:  { partials:[1,0.55,0.32,0.40,0.16,0.22,0.08],   decay:0,   hold:true,  hammer:0,    gain:0.17 }
  };
  var timbre = 'grand';

  function initAudio(){
    if (ctx){ if (ctx.state === 'suspended') ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = volume;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.ratio.value = 4;
    master.connect(comp);
    comp.connect(ctx.destination);
    var len = Math.floor(ctx.sampleRate * 0.15);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  }

  function noteOn(midi, velocity){
    initAudio();
    if (!ctx) return;
    if (active.has(midi)) killVoice(active.get(midi), 0.03);
    var vel = velocity == null ? 0.85 : velocity;
    var t = TIMBRES[timbre];
    var now = ctx.currentTime;
    var f = 440 * Math.pow(2, (midi - 69) / 12);

    var voice = ctx.createGain();
    voice.gain.setValueAtTime(1, now);
    var filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(Math.min(16000, f * (6 + 5 * vel) + 800), now);
    filt.Q.value = 0.6;
    voice.connect(filt);
    filt.connect(master);

    var pitchFactor = Math.pow(2, -(midi - 60) / 24);
    var nodes = [], longest = 0.4;

    for (var i = 0; i < t.partials.length; i++){
      var amp = t.partials[i] * t.gain * vel;
      if (amp < 0.0006) continue;
      var osc = ctx.createOscillator();
      osc.type = 'sine';
      var n = i + 1;
      osc.frequency.setValueAtTime(f * n * (1 + n * n * 0.00035), now);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(amp, now + (t.hold ? 0.035 : 0.006));
      if (t.hold){
        osc.connect(g); g.connect(voice); osc.start(now);
      } else {
        var dur = Math.max(0.28, t.decay * Math.pow(0.68, i) * pitchFactor);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        if (dur > longest) longest = dur;
        osc.connect(g); g.connect(voice);
        osc.start(now); osc.stop(now + dur + 0.05);
      }
      nodes.push(osc);
    }

    if (t.hammer > 0 && noiseBuf){
      var src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(Math.min(9000, f * 3.2), now);
      bp.Q.value = 0.9;
      var ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, now);
      ng.gain.linearRampToValueAtTime(0.07 * t.hammer * vel, now + 0.003);
      ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
      src.connect(bp); bp.connect(ng); ng.connect(voice);
      src.start(now); src.stop(now + 0.16);
    }

    var v = { gain: voice, nodes: nodes, hold: t.hold };
    active.set(midi, v);
    if (!t.hold){
      setTimeout(function(){ if (active.get(midi) === v) active.delete(midi); }, (longest + 0.3) * 1000);
    }
    paint(midi, true);
  }

  function killVoice(v, time){
    if (!ctx || !v) return;
    var r = time == null ? 0.26 : time, now = ctx.currentTime;
    try {
      v.gain.gain.cancelScheduledValues(now);
      v.gain.gain.setValueAtTime(v.gain.gain.value, now);
      v.gain.gain.exponentialRampToValueAtTime(0.0001, now + r);
    } catch(e){}
    for (var i = 0; i < v.nodes.length; i++){
      try { v.nodes[i].stop(now + r + 0.02); } catch(e){}
    }
  }

  function noteOff(midi){
    if (sustain){ pedaled.add(midi); paint(midi, true); return; }
    var v = active.get(midi);
    if (v){ killVoice(v, v.hold ? 0.14 : 0.3); active.delete(midi); }
    paint(midi, false);
  }

  function allOff(){
    held.forEach(function(m){ noteOff(m); });
    held.clear();
    locked.forEach(function(m){ var v = active.get(m); if (v){ killVoice(v, 0.2); active.delete(m); } paint(m, false); });
    locked.clear();
  }

  /* ---------- 건반 ---------- */
  var piano = document.getElementById('piano');
  var keyEls = new Map();

  function rangeFor(w){
    if (w < 620) return [60, 84];   // 2옥타브
    if (w < 1000) return [48, 84];  // 3옥타브
    return [36, 84];                // 4옥타브
  }

  var rangeMod = document.getElementById('rangeMod');
  var rangeSelect = document.getElementById('rangeSelect');
  var rangeLabel = document.getElementById('rangeLabel');
  var mobileStart = 60;

  function midiName(m){ return NOTE_ABC[m % 12] + (Math.floor(m / 12) - 1); }
  function updateRangeControls(){
    var span = parseInt(rangeSelect.value, 10) * 12;
    var maxStart = GLOBAL_END - span;
    rangePrev.disabled = mobileStart <= GLOBAL_START;
    rangeNext.disabled = mobileStart >= maxStart;
    rangePrev.style.opacity = rangePrev.disabled ? .35 : 1;
    rangeNext.style.opacity = rangeNext.disabled ? .35 : 1;
    rangeLabel.textContent = midiName(START) + '–' + midiName(END);
  }
  function moveMobileRange(direction){
    var span = parseInt(rangeSelect.value, 10) * 12;
    var maxStart = GLOBAL_END - span;
    mobileStart = Math.max(GLOBAL_START, Math.min(maxStart, mobileStart + direction * 12));
    mobileStart = GLOBAL_START + Math.round((mobileStart - GLOBAL_START) / 12) * 12;
    applyRange();
  }
  var rangePrev = document.getElementById('rangePrev');
  var rangeNext = document.getElementById('rangeNext');
  rangePrev.addEventListener('click', function(){ moveMobileRange(-1); });
  rangeNext.addEventListener('click', function(){ moveMobileRange(1); });
  rangeSelect.addEventListener('change', function(){
    var span = parseInt(rangeSelect.value, 10) * 12;
    mobileStart = Math.min(60, GLOBAL_END - span);
    applyRange();
  });

  function buildKeys(){
    piano.textContent = '';
    keyEls.clear();
    for (var m = START; m <= END; m++){
      var el = document.createElement('div');
      el.className = 'key ' + (isBlack(m) ? 'black' : 'white');
      el.dataset.midi = String(m);
      var s = document.createElement('span');
      s.className = 'lbl';
      el.appendChild(s);
      piano.appendChild(el);
      keyEls.set(m, el);
    }
  }

  function layout(){
    var ref = keyEls.get(START);
    if (!ref) return;
    var w = ref.getBoundingClientRect().width;
    if (!w) return;
    var bw = Math.max(14, Math.round(w * 0.62));
    keyEls.forEach(function(el, mid){
      if (!isBlack(mid)) return;
      var left = keyEls.get(mid - 1);
      if (!left) return;
      el.style.width = bw + 'px';
      el.style.left = (left.offsetLeft + left.offsetWidth - bw / 2) + 'px';
    });
  }

  function paint(midi, on){
    var el = keyEls.get(midi);
    if (el) el.classList.toggle('on', !!on);
  }

  /* ---------- 자판 ---------- */
  var LOW = {KeyZ:0,KeyS:1,KeyX:2,KeyD:3,KeyC:4,KeyV:5,KeyG:6,KeyB:7,KeyH:8,KeyN:9,KeyJ:10,KeyM:11,Comma:12,KeyL:13,Period:14,Semicolon:15,Slash:16};
  var HIGH = {KeyQ:12,Digit2:13,KeyW:14,Digit3:15,KeyE:16,KeyR:17,Digit5:18,KeyT:19,Digit6:20,KeyY:21,Digit7:22,KeyU:23,KeyI:24,Digit9:25,KeyO:26,Digit0:27,KeyP:28};
  var CODE_LABEL = {Comma:',',Period:'.',Semicolon:';',Slash:'/'};
  var base = 60;

  function keyToMidi(code){
    var off = LOW[code];
    if (off === undefined) off = HIGH[code];
    if (off === undefined) return null;
    var m = base + off;
    return (m >= START && m <= END) ? m : null;
  }
  function labelForCode(code){
    if (CODE_LABEL[code]) return CODE_LABEL[code];
    if (code.indexOf('Key') === 0) return code.slice(3);
    if (code.indexOf('Digit') === 0) return code.slice(5);
    return '';
  }

  var labelMode = 'key';
  function renderLabels(){
    var byMidi = {};
    if (labelMode === 'key'){
      [LOW, HIGH].forEach(function(map){
        for (var code in map){
          var mm = keyToMidi(code);
          if (mm !== null && !byMidi[mm]) byMidi[mm] = labelForCode(code);
        }
      });
    }
    keyEls.forEach(function(el, mid){
      var lbl = el.firstChild;
      if (labelMode === 'none'){ lbl.textContent = ''; return; }
      if (labelMode === 'key'){ lbl.textContent = byMidi[mid] || ''; return; }
      var pc = mid % 12;
      lbl.textContent = (labelMode === 'abc')
        ? NOTE_ABC[pc] + (isBlack(mid) ? '' : String(Math.floor(mid / 12) - 1))
        : NOTE_SOLFA[pc];
    });
  }

  var octLabel = document.getElementById('octLabel');
  var octDown = document.getElementById('octDown');
  var octUp = document.getElementById('octUp');

  function clampBase(){
    var lo = START, hi = Math.max(START, END - 12);
    if (base < lo) base = lo;
    if (base > hi) base = hi;
    base = lo + Math.round((base - lo) / 12) * 12;
    if (base > hi) base -= 12;
    octLabel.textContent = 'C' + (Math.floor(base / 12) - 1);
    octDown.disabled = (base - 12 < lo);
    octUp.disabled = (base + 12 > hi);
    octDown.style.opacity = octDown.disabled ? .35 : 1;
    octUp.style.opacity = octUp.disabled ? .35 : 1;
  }

  function applyRange(){
    var w = piano.getBoundingClientRect().width || window.innerWidth;
    var touchLayout = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    rangeMod.hidden = !touchLayout;
    var span = parseInt(rangeSelect.value, 10) * 12;
    var maxStart = GLOBAL_END - span;
    mobileStart = Math.max(GLOBAL_START, Math.min(maxStart, mobileStart));
    var r = touchLayout ? [mobileStart, mobileStart + span] : rangeFor(w);
    if (r[0] !== START || r[1] !== END){
      allOff();
      START = r[0]; END = r[1];
      buildKeys();
      clampBase();
      renderLabels();
    }
    layout();
    updateRangeControls();
  }

  /* ---------- 입력 ---------- */
  var pointers = new Map();
  var swipePointers = new Map();

  function velocityFrom(el, clientY){
    var r = el.getBoundingClientRect();
    var frac = (clientY - r.top) / Math.max(1, r.height);
    frac = Math.min(1, Math.max(0, frac));
    return 0.55 + 0.45 * frac;
  }
  function keyAt(x, y){
    var el = document.elementFromPoint(x, y);
    return (el && el.closest) ? el.closest('.key') : null;
  }
  function press(midi, vel){
    if (midi === null || held.has(midi)) return;
    held.add(midi);
    pedaled.delete(midi);
    noteOn(midi, vel);
  }
  function lift(midi){
    if (midi === null || !held.has(midi)) return;
    held.delete(midi);
    noteOff(midi);
  }

  piano.addEventListener('pointerdown', function(e){
    var key = e.target.closest ? e.target.closest('.key') : null;
    if (!key) return;
    e.preventDefault();
    var m = parseInt(key.dataset.midi, 10);
    var vel = velocityFrom(key, e.clientY);
    if (lockMode){
      if (locked.has(m)){ locked.delete(m); held.delete(m); noteOff(m); }
      else { locked.add(m); press(m, vel); }
      return;
    }
    try { piano.setPointerCapture(e.pointerId); } catch(err){}
    if (e.pointerType === 'touch'){
      swipePointers.set(e.pointerId, {midi:m, x:e.clientX, y:e.clientY, moved:false});
      return;
    }
    pointers.set(e.pointerId, m);
    press(m, vel);
  }, {passive:false});

  piano.addEventListener('pointermove', function(e){
    if (swipePointers.has(e.pointerId)){
      var gesture = swipePointers.get(e.pointerId);
      var dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
      if (!gesture.moved && Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy) * 1.15){
        gesture.moved = true;
        gesture.x = e.clientX;
        gesture.y = e.clientY;
        moveMobileRange(dx < 0 ? 1 : -1);
      } else if (Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx)){
        swipePointers.delete(e.pointerId);
        pointers.set(e.pointerId, gesture.midi);
        press(gesture.midi, 0.8);
      }
      return;
    }
    if (lockMode || !pointers.has(e.pointerId)) return;
    var key = keyAt(e.clientX, e.clientY);
    var m = key ? parseInt(key.dataset.midi, 10) : null;
    var prev = pointers.get(e.pointerId);
    if (m !== prev){
      if (prev !== null) lift(prev);
      pointers.set(e.pointerId, m);
      if (m !== null) press(m, key ? velocityFrom(key, e.clientY) : 0.8);
    }
  }, {passive:false});

  function endPointer(e){
    if (swipePointers.has(e.pointerId)){
      var gesture = swipePointers.get(e.pointerId);
      swipePointers.delete(e.pointerId);
      if (!gesture.moved && e.type === 'pointerup'){
        press(gesture.midi, 0.85);
        setTimeout(function(){ lift(gesture.midi); }, 140);
      }
      return;
    }
    if (!pointers.has(e.pointerId)) return;
    lift(pointers.get(e.pointerId));
    pointers.delete(e.pointerId);
  }
  piano.addEventListener('pointerup', endPointer);
  piano.addEventListener('pointercancel', endPointer);
  window.addEventListener('blur', function(){
    pointers.forEach(function(m){ lift(m); });
    pointers.clear();
    allOff();
    setSustain(false);
  });
  document.addEventListener('contextmenu', function(e){
    if (e.target.closest && e.target.closest('.piano')) e.preventDefault();
  });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT') return;
    if (e.code === 'Space'){ e.preventDefault(); if (!e.repeat) setSustain(true); return; }
    if (e.repeat) return;
    var m = keyToMidi(e.code);
    if (m !== null){ e.preventDefault(); press(m, 0.85); }
  });
  document.addEventListener('keyup', function(e){
    if (e.code === 'Space'){ setSustain(false); return; }
    var m = keyToMidi(e.code);
    if (m !== null) lift(m);
  });

  /* ---------- 스위치 ---------- */
  var sustainBtn = document.getElementById('sustainBtn');
  var lockBtn = document.getElementById('lockBtn');

  function setSustain(on){
    sustain = on;
    sustainBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (!on){
      pedaled.forEach(function(m){
        if (!held.has(m) && !locked.has(m)){
          var v = active.get(m);
          if (v){ killVoice(v, v.hold ? 0.16 : 0.34); active.delete(m); }
          paint(m, false);
        }
      });
      pedaled.clear();
    }
  }
  sustainBtn.addEventListener('click', function(){ setSustain(!sustain); });
  lockBtn.addEventListener('click', function(){
    lockMode = !lockMode;
    lockBtn.setAttribute('aria-pressed', lockMode ? 'true' : 'false');
    if (!lockMode){
      locked.forEach(function(m){ held.delete(m); noteOff(m); });
      locked.clear();
    }
  });

  document.getElementById('timbre').addEventListener('change', function(e){ timbre = e.target.value; });
  document.getElementById('labelMode').addEventListener('change', function(e){
    labelMode = e.target.value; renderLabels();
  });
  document.getElementById('vol').addEventListener('input', function(e){
    volume = e.target.value / 100;
    if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.01);
  });
  function shiftOctave(d){
    var next = base + d * 12;
    if (next < START || next > Math.max(START, END - 12)) return;
    allOff();
    base = next;
    clampBase();
    if (labelMode === 'key') renderLabels();
  }
  octDown.addEventListener('click', function(){ shiftOctave(-1); });
  octUp.addEventListener('click', function(){ shiftOctave(1); });

  /* ---------- 가로 전체화면 ---------- */
  var docEl = document.documentElement;
  var canFS = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
  var canLock = !!(window.screen && screen.orientation && screen.orientation.lock);

  function goLandscape(){
    var p;
    try {
      p = docEl.requestFullscreen ? docEl.requestFullscreen({navigationUI:'hide'})
        : (docEl.webkitRequestFullscreen ? docEl.webkitRequestFullscreen() : Promise.reject());
    } catch(e){ p = Promise.reject(e); }
    Promise.resolve(p).then(function(){
      if (canLock) return screen.orientation.lock('landscape');
    }).catch(function(){});
  }
  function exitFS(){
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    if (canLock){ try { screen.orientation.unlock(); } catch(e){} }
  }

  var fsMod = document.getElementById('fsMod');
  var fsBtn = document.getElementById('fsBtn');
  var lockBtnRot = document.getElementById('lockBtnRot');
  var rotateText = document.getElementById('rotateText');

  if (canFS){
    fsMod.hidden = false;
    fsBtn.addEventListener('click', function(){
      if (document.fullscreenElement || document.webkitFullscreenElement) exitFS();
      else goLandscape();
    });
    document.addEventListener('fullscreenchange', function(){
      var on = !!document.fullscreenElement;
      fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      setTimeout(applyRange, 120);
    });
    lockBtnRot.addEventListener('click', goLandscape);
  } else {
    lockBtnRot.hidden = true;
    rotateText.textContent = '건반이 넓게 펼쳐져야 연주할 수 있습니다. 아이폰은 제어센터에서 화면 회전 잠금을 해제한 뒤 기기를 돌려주세요.';
  }

  /* ---------- 시작 ---------- */
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyRange, 90);
  });
  if (window.screen && screen.orientation){
    screen.orientation.addEventListener('change', function(){ setTimeout(applyRange, 150); });
  }
  window.addEventListener('orientationchange', function(){ setTimeout(applyRange, 250); });

  buildKeys();
  clampBase();
  renderLabels();
  applyRange();
  setTimeout(applyRange, 80);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyRange);
})();
</script>
</body>
</html>
